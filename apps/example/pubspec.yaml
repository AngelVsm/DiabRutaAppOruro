name: diabruta_example
description: "DiabRuta, rutas de Oruro."
resolution: workspace
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  go_router: ^17.0.1
  diabruta_interfaces: ^1.0.0
  diabruta_utils: ^1.0.0
  diabruta_about: ^1.0.0
  diabruta_transport_list: ^1.0.0
  diabruta_maps: ^1.0.0
  diabruta_routing: ^1.0.0
  diabruta_saved_places: ^1.0.0
  diabruta_home_screen: ^1.0.0
  diabruta_search_locations: ^1.0.0
  diabruta_feedback: ^1.0.0
  diabruta_fares: ^1.0.0
  diabruta_settings: ^1.0.0
  diabruta_ui: ^1.0.0
  diabruta_navigation: ^1.0.0
  latlong2: ^0.9.1
  # 0.26.2 minimum: 0.26.1 still crashes on iOS with SIGABRT
  # (std::domain_error from mbgl::LatLng) when a camera op reaches a map
  # whose native frame is zero-sized — a route-detail screen fitting the
  # camera right after creating its map hits it. Fixed upstream in 0.26.2
  # (maplibre/flutter-maplibre-gl#819, PR #841); crashed a real-device
  # App Review submission on 0.25.0 (Trujillo, 2026-08-09).
  maplibre_gl: ^0.26.2
  flutter_svg: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/routing/
