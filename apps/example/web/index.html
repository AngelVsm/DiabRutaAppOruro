<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transporte público de Oruro, Bolivia.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DiabRuta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DiabRuta</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS for maplibre package web support -->
  
  <script src='https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.css' rel='stylesheet' />

  <!-- Optional: PMTiles support -->
  <script src='https://unpkg.com/pmtiles@^4.0/dist/pmtiles.js'></script>
</head>
<body>
  <script>
    if (window.location.protocol === 'file:') {
      document.body.innerHTML =
        '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:48px auto;padding:24px;border-radius:12px;background:#1a1a1a;color:#f5f5f5;line-height:1.5">' +
        '<h2 style="margin-top:0;color:#ff5252">DiabRuta Web</h2>' +
        '<p>Los navegadores bloquean las aplicaciones web cuando se abren directamente como archivo (<code>file://</code>).</p>' +
        '<p>Para abrir DiabRuta en tu navegador, haz doble clic en <b>abrir_web.bat</b> (junto a este archivo) o sirve esta carpeta con un servidor HTTP local.</p>' +
        '</div>';
    } else {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
