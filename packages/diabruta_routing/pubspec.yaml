name: diabruta_routing
description: Route planning for DiabRuta, calculated on the phone from a GTFS file.
version: 1.0.0
homepage: https://github.com/AngelVsm/DiabRutaAppOruro
publish_to: none
resolution: workspace

flutter:
  generate: true

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  diabruta_planner: ^1.0.0
  diabruta_utils: ^1.0.0
  diabruta_interfaces: ^1.0.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  latlong2: ^0.9.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  archive: ^4.0.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.0
