name: diabruta_poi_layers
description: POI (Points of Interest) map layers for DiabRuta
version: 1.0.0
homepage: https://github.com/AngelVsm/DiabRutaAppOruro
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  equatable: ^2.0.8
  latlong2: ^0.9.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.1.0
  diabruta_interfaces:
    path: ../diabruta_interfaces
  diabruta_utils:
    path: ../diabruta_utils
  diabruta_maps:
    path: ../diabruta_maps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
