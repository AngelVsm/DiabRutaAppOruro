name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DiabRuta ${{ github.ref_name }}
          body: |
            App de transporte público para Oruro, Bolivia.

            Android: DiabRuta-android.apk
            Windows: DiabRuta-windows.zip
            Web: DiabRuta-web.zip
