name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Get dependencies
        working-directory: apps/example
        run: flutter pub get
      - name: Build Android APK
        working-directory: apps/example
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Build Web
        working-directory: apps/example
        run: flutter build web --release
      - name: Package Android and Web
        run: |
          mkdir -p release-artifacts
          cp apps/example/build/app/outputs/flutter-apk/app-release.apk release-artifacts/DiabRuta-android.apk
          (cd apps/example/build/web && zip -r ../../../../release-artifacts/DiabRuta-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: android-web
          path: release-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Get dependencies
        working-directory: apps/example
        run: flutter pub get
      - name: Build Windows
        working-directory: apps/example
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Compress-Archive -Path apps/example/build/windows/x64/runner/Release/* -DestinationPath release-artifacts/DiabRuta-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-artifacts/DiabRuta-windows.zip

  build-ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Get dependencies
        working-directory: apps/example
        run: flutter pub get
      - name: Build iOS (unsigned)
        working-directory: apps/example
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p release-artifacts Payload
          cp -r apps/example/build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r release-artifacts/DiabRuta-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: release-artifacts/DiabRuta-ios-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-web, build-windows, build-ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DiabRuta ${{ github.ref_name }}
          files: all-artifacts/*
          body: |
            ## Changelog

            ### Nuevo
            - Compilación para **iOS sin firmar** (`DiabRuta-ios-unsigned.ipa`) para pruebas con Sideloadly / AltStore / SideStore
            - Lanzador `abrir_web.bat` para abrir DiabRuta Web en Windows con servidor HTTP local automático

            ### Corregido
            - **Windows:** se corrigió el arranque y el mapa en escritorio usando `flutter_map` como respaldo nativo y protegiendo la brújula en equipos sin sensor
            - **Web:** se corrigieron las rutas iniciales (`#/` y `/index.html`), `<base href="./">` y el error de conexión rechazada en `abrir_web.bat`
            - **iOS:** se corrigió la calibración de la brújula/giroscopio usando el rumbo calibrado nativo de CoreLocation (`CLHeading`) en lugar del magnetómetro crudo sin calibrar
            - **Íconos:** se actualizaron los íconos oficiales de DiabRuta en Web, Windows (`.exe`) e iOS

            ### Mejorado
            - Al cerrar y volver a abrir la app sin ruta activa, ahora inicia limpia (en segundo plano mantiene la ruta en curso)
            - Se actualizaron los enlaces de redes sociales (Instagram: `@annhhelz`, TikTok: `@annhhelz`, Facebook: `annhhelzz`)

            ### Descargas
            - Android: `DiabRuta-android.apk`
            - Windows: `DiabRuta-windows.zip`
            - Web: `DiabRuta-web.zip` (ejecuta `abrir_web.bat` en Windows o sirve la carpeta con HTTP)
            - iOS (sin firmar, para pruebas con Sideloadly / AltStore / SideStore): `DiabRuta-ios-unsigned.ipa`
