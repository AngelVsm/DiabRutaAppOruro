name: diabruta_mono
environment:
  sdk: ^3.10.0

workspace:
  - apps/example

  # Core Packages
  - packages/diabruta_interfaces
  - packages/diabruta_utils
  - packages/diabruta_base_widgets
  - packages/diabruta_custom_material
  - packages/diabruta_maps
  - packages/diabruta_planner
  - packages/diabruta_routing
  - packages/diabruta_routing_ui
  - packages/diabruta_search_locations
  - packages/diabruta_ui
  - packages/diabruta_notifications

  # Screen Packages
  - packages/screens/diabruta_about
  - packages/screens/diabruta_fares
  - packages/screens/diabruta_feedback
  - packages/screens/diabruta_home_screen
  - packages/screens/diabruta_saved_places
  - packages/screens/diabruta_settings
  - packages/screens/diabruta_transport_list

  # Navigation Package
  - packages/diabruta_navigation

  # POI Layers
  - packages/diabruta_poi_layers

dev_dependencies:
  melos: ^7.3.0
  flutter_lints: ^6.0.0

melos:
  scripts:
    analyze:
      run: flutter analyze --no-fatal-infos
      description: Run Flutter analyze on all packages

    ci:analyze:
      run: flutter analyze --no-fatal-infos --no-fatal-warnings 
      exec:
        concurrency: 1


    format:
      run: dart format .
      description: Format all Dart files

    test:
      exec: flutter test
      description: Run tests for all packages
      packageFilters:
        dirExists: test

    ci:test:
      # Same as `test` but skips @Tags('integration') suites, which hit
      # real OTP / Photon / Nominatim servers and can't run on CI. This is
      # what the CI workflow runs so a green check actually means the unit
      # and widget tests passed (issue #756).
      exec: flutter test --exclude-tags integration
      description: Run non-integration tests for all packages (used by CI)
      packageFilters:
        dirExists: test

    build:
      name: Generate Build files
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 6
      packageFilters:
        dependsOn: build_runner

    l10n:
      name: Generate Translation files
      run: flutter gen-l10n
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: flutter_localizations


